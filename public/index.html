<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060b0a">
<title>Spectra</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/spectra.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dials" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13 L15.5 9.5 M9.5 2.5 H14.5 M12 2.5 V5"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 10.5 V18"/><circle cx="12" cy="6.5" r="0.8" fill="currentColor"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 6 H21 M3 12 H21 M3 18 H21"/><circle cx="15" cy="6" r="2" fill="#0e1512"/><circle cx="8" cy="12" r="2" fill="#0e1512"/><circle cx="17" cy="18" r="2" fill="#0e1512"/></symbol>
  <symbol id="i-align" viewBox="0 0 24 24"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4 H20 V10 M20 4 L13 11 M10 20 H4 V14 M4 20 L11 13"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M20 4 L14 10 M14 5 V10 H19 M4 20 L10 14 M10 19 V14 H5"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4 L20 12 L6 20 Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="currentColor" stroke="none"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-step" viewBox="0 0 24 24"><path d="M5 5 L15 12 L5 19 Z M19 5 V19"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12 a8 8 0 1 0 2.5 -5.8 M4 4 V9 H9"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path d="M2 12 C5 4 8 4 11 12 S17 20 22 12"/></symbol>
  <symbol id="i-trips" viewBox="0 0 24 24"><path d="M3 12 H5 M7 8 V16 M10 5 V19 M13 9 V15 M16 6 V18 M19 10 V14 M21 12 H22"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14 a4 4 0 0 0 5.66 0 l3 -3 a4 4 0 0 0 -5.66 -5.66 l-1 1 M14 10 a4 4 0 0 0 -5.66 0 l-3 3 a4 4 0 0 0 5.66 5.66 l1 -1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18"/></symbol>
</svg>

<div class="app">
  <header class="top">
    <button class="glass round" id="open-controls" aria-label="Field controls"><svg class="icon"><use href="#i-dials"/></svg></button>
    <div class="glass top-group">
      <button class="glass round" id="open-notes" aria-label="Field notes"><svg class="icon"><use href="#i-info"/></svg></button>
      <button class="glass round" id="open-controls-2" aria-label="Display controls"><svg class="icon"><use href="#i-sliders"/></svg></button>
    </div>
  </header>

  <section class="title">
    <h1>Spectra</h1>
    <div class="eyebrow">Electromagnetic dynamics</div>
    <p>One wave, decomposed.</p>
  </section>

  <div class="seg" id="bands" role="group" aria-label="Jump to band"></div>
  <nav class="chips" id="instruments" aria-label="Instruments"></nav>

  <main class="layout">
    <section class="panel instrument" id="instrument" aria-labelledby="inst-title">
      <div class="panel-head">
        <div><div class="label" id="inst-title"></div><div class="sub" id="inst-detail"></div></div>
        <div class="head-actions">
          <button class="glass" id="align"><svg class="icon" style="width:16px;height:16px"><use href="#i-align"/></svg>Align</button>
          <button class="glass round" id="fullscreen" aria-label="Full screen"><svg class="icon" style="width:18px;height:18px"><use href="#i-expand"/></svg></button>
        </div>
      </div>
      <div class="toolbar" id="inst-toolbar"></div>
      <div class="stage" id="stage">
        <canvas id="canvas" aria-hidden="true"></canvas>
        <div id="stage-labels"></div>
      </div>
      <div class="statusline" id="statusline" aria-live="polite"></div>
      <div class="readouts" id="readouts"></div>
      <div class="aux" id="inst-aux"></div>
    </section>

    <div class="scrim" id="scrim"></div>
    <aside class="controls" id="controls" aria-label="Field controls"></aside>
  </main>

  <div class="transport">
    <button class="glass play" id="play"><svg class="icon" style="width:16px;height:16px"><use href="#i-pause"/></svg><span>Pause</span></button>
    <button class="glass" id="step"><svg class="icon" style="width:16px;height:16px"><use href="#i-step"/></svg>Step</button>
    <div class="clock" aria-live="off"><span class="k">κ SLOWED</span><span class="v" id="slowmo">—</span></div>
  </div>

  <dialog id="notes-dialog" aria-labelledby="notes-title"><div class="notes" id="notes"></div></dialog>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="/src/ui/app.js"></script>
</body>
</html>
